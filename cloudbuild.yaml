# cloudbuild.yaml — place this in the repo ROOT (not inside /server)
#
# Wires up: push to GitHub -> Cloud Build builds the server/Dockerfile ->
# deploys straight to your existing Cloud Run service.
#
# Set up once via GCP Console -> Cloud Build -> Triggers -> Create Trigger,
# connect this repo, point it at this file, and it runs on every push to main.

steps:
  # Build the Docker image from server/Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lorekeeper-backend:$SHORT_SHA'
      - '-f'
      - 'server/Dockerfile'
      - 'server'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lorekeeper-backend:$SHORT_SHA'

  # Deploy the new image to your existing Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lorekeeper-backend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lorekeeper-backend:$SHORT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/lorekeeper-backend:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
